name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # packages/web and the web-mode runtime build against the upstream monorepo
  # checkout at the vendor branch baseline. Update when the vendor branch moves.
  ZCODE_VENDORED_REV: 29628c9acdb81b703bbd4080c207a0e7ce5e276e

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ env.ZCODE_VENDORED_REV }}
          path: zcode

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The zh web overlay replaces the upstream packages/web (branding patches
      # plus the Bun build script); @zcode/ui and the rest stay upstream.
      - name: Overlay zh packages/web onto the monorepo
        run: rsync -a --delete "$GITHUB_WORKSPACE/packages/web/" "$GITHUB_WORKSPACE/zcode/packages/web/"

      - name: Install monorepo dependencies
        working-directory: zcode
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web dist with Bun
        working-directory: zcode
        env:
          TAG: ${{ github.ref_name }}
        run: ZCODE_BUILD_VERSION="$TAG" bun packages/web/scripts/build.mjs

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: zcode/packages/web/dist

  packages:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ubuntu-latest dropped npm from PATH between the v0.3.0 and v0.4.0
      # runs (stage-tui-runtime.mjs npm-packs the three non-host OpenTUI
      # native triplets). Pin node and npm explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

      - name: Install dependencies and build workspace packages
        run: |
          bun install --frozen-lockfile
          sh build-all.sh

      - name: Build release bundle (minified, no sourcemap)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd packages/cli
          ZCODE_BUILD_VERSION="$TAG" bun scripts/build.mjs --release
          test -f dist/zcode.cjs
          test -f dist/provider/zcode-builtin.json

      - name: Assemble release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          # bundle (B2): launcher + minified cjs + staged provider config
          # + official plugin trees (node_repl browser bridge, browser-use skill)
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/bin" "$STAGE/dist/provider"
          cp bin/zh "$STAGE/bin/zh"
          cp packages/cli/dist/zcode.cjs "$STAGE/dist/zcode.cjs"
          cp packages/cli/dist/provider/zcode-builtin.json "$STAGE/dist/provider/zcode-builtin.json"
          cp packages/cli/dist/THIRD_PARTY_NOTICES.md "$STAGE/THIRD_PARTY_NOTICES.md"
          cp -R official-plugins "$STAGE/official-plugins"
          tar -czf "out/zheadless-bundle-$TAG.tar.gz" -C "$STAGE" bin dist official-plugins THIRD_PARTY_NOTICES.md

          # playwright-core driver (B2/C): pure JS, one platform-independent
          # asset; extracted by the installer into <install root>/node_modules
          PWC_DIR=$(cd packages/cli && node -e "console.log(require('path').dirname(require.resolve('playwright-core/package.json')))")
          tar -czf "out/playwright-core-$TAG.tar.gz" -C "$PWC_DIR/.." playwright-core

          # tui runtime closure: @zcode/tui stays external from the bundle and
          # binaries (OpenTUI's native loader uses top-level await), so it ships
          # as its own asset and the installer extracts it into
          # <install root>/node_modules
          bun scripts/stage-tui-runtime.mjs --out out --tag "$TAG"

          # web mode (zh web): the CI-built web dist plus the staged server
          # runtime (entry-http.js + external dependency tree with node-pty
          # prebuilds). Extracted by install-remote.sh --web into the install
          # root, where `zh web` finds <root>/web and <root>/server.
          bun scripts/stage-server-runtime.mjs server-stage
          STAGE_WEB=$(mktemp -d)
          cp -R packages/web/dist "$STAGE_WEB/web"
          cp -R server-stage "$STAGE_WEB/server"
          tar -czf "out/zheadless-web-$TAG.tar.gz" -C "$STAGE_WEB" web server
          rm -rf "$STAGE_WEB" server-stage

          # standalone binaries (C): bun --compile, cross-compiled per target.
          # dist/zcode.cjs rides along because the interactive TUI needs to
          # re-exec the bundle through the binary's own bun runtime
          # (BUN_BE_BUN=1); the sealed binary cannot resolve the TUI closure
          # from disk on its own.
          cd packages/cli
          for TARGET in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile src/main.ts \
              --target="bun-$TARGET" \
              --outfile="zh-$TARGET" \
              --external playwright-core --external koffi --external @zcode/tui \
              --define "__CLI_VERSION__:\"$TAG\""
            BIN_STAGE=$(mktemp -d)
            mkdir -p "$BIN_STAGE/bin" "$BIN_STAGE/dist" "$BIN_STAGE/config/provider"
            cp "zh-$TARGET" "$BIN_STAGE/bin/zh"
            chmod +x "$BIN_STAGE/bin/zh"
            cp dist/zcode.cjs "$BIN_STAGE/dist/zcode.cjs"
            cp ../../config/provider/zcode-builtin.json "$BIN_STAGE/config/provider/zcode-builtin.json"
            cp -R ../../official-plugins "$BIN_STAGE/official-plugins"
            tar -czf "../../out/zh-$TAG-$TARGET.tar.gz" -C "$BIN_STAGE" bin dist config official-plugins
            rm -rf "$BIN_STAGE"
          done
          cd ../..

          # checksums for every asset
          cd out
          sha256sum *.tar.gz > SHA256SUMS
          cd ..

          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: out/

  publish:
    needs: packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: out

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          zheadless $TAG

          Install (auto: bundle when bun or node >= 22 is present, binary otherwise):

              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install-remote.sh | sh

          Choose a method explicitly:

              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install-remote.sh | sh -s -- --method=auto    # runtime-aware default
              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install-remote.sh | sh -s -- --method=binary   # standalone, no runtime needed
              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install-remote.sh | sh -s -- --method=bundle   # bun with node fallback
              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install-remote.sh | sh -s -- --method=source   # build from source, needs bun
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "zheadless $TAG" \
            --notes-file notes.md \
            out/*
